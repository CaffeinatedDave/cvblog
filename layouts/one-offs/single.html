{{ define "head" }}
  {{ range .Params.styles }}
    <link rel="stylesheet" href="{{ . | relURL }}?v={{ site.Params.assetVersion }}">
  {{ end }}
{{ end }}

{{ define "main" }}
<article class="article project-article">
  <header class="article-header">
    <p class="eyebrow">{{ .Params.kicker | default "Single page app" }}</p>
    <h1>{{ .Title }}</h1>
    {{ with .Params.summary }}<p class="lede">{{ . }}</p>{{ end }}
  </header>
  <div class="article-body project-body">
    {{ .Content }}
  </div>
</article>

{{ range .Params.scripts }}
  <script src="{{ . | relURL }}?v={{ site.Params.assetVersion }}" defer></script>
{{ end }}
{{ end }}
